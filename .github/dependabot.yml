version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    # Let a week pass before proposing a new release: compromised releases
    # are usually found and pulled within days. Security updates are not
    # delayed.
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
    # The "scope: subject" style of the commits of this repository.
    commit-message:
      prefix: deps

  # Also updates the commit SHAs the workflows pin actions to, and their
  # version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
