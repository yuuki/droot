name: Security

# Static analysis of the Go code with CodeQL, whose results appear in the
# Security tab (Code scanning). Known vulnerabilities of the dependencies and
# the standard library are checked by govulncheck in the vulnerabilities job
# of CI, which also runs weekly and before every release.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly, for the queries that CodeQL adds or improves between pushes.
  schedule:
    - cron: "49 3 * * 4"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # droot builds with `go build ./...` alone (no cgo, no generated
          # code): autobuild is enough. The workflows are audited by zizmor
          # (make lint-actions), so the actions language is not analysed.
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          # The extractor builds the code itself: nothing to gain from a cache.
          cache: false
      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}
