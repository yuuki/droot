name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version declared in go.mod and the latest release.
        go: ["1.26.x", "1.27.x"]
    env:
      # Test with the matrix version instead of the toolchain line of go.mod.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests
        run: go test -race ./...
      - name: Unit tests as root (mount, mknod, capabilities)
        run: sudo env "PATH=$PATH" GOTOOLCHAIN=local go test -race -count=1 ./mounter/... ./osutil/... ./identity/...
      - name: Vet for macOS
        run: GOOS=darwin go vet ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make build
      - name: End-to-end tests against Docker
        run: sudo ./script/integration-test.sh ./droot

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make cross
