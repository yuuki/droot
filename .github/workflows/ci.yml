name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly, for what changes without a commit: new vulnerability advisories
  # (vulnerabilities), Go releases (go-version: stable) and runner images. The
  # fuzz targets also run longer.
  schedule:
    - cron: "59 1 * * 6"
  # The release workflow runs CI on the tagged commit before releasing it.
  workflow_call:

permissions:
  contents: read

concurrency:
  # "ci" keeps the group apart from the caller's when called by the release
  # workflow (github.workflow is then the caller's name).
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  # Only a new push to a pull request cancels its previous run: every commit
  # of master (and a release, whose event is the tag push) is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Release scripts
        run: make test-scripts

  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The minimum version declared in go.mod and the latest release.
        go: ["1.26.x", "1.27.x"]
    env:
      # Test with the matrix version instead of the toolchain line of go.mod.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests
        run: make test-race
      - name: Unit tests as root (mount, mknod, capabilities)
        run: sudo env "PATH=$PATH" GOTOOLCHAIN=local go test -race -count=1 ./internal/mounter/... ./internal/osutil/... ./internal/identity/...
      - name: Vet for macOS
        run: GOOS=darwin go vet ./...

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    # About 7 minutes on pull requests, 45 on the weekly schedule.
    timeout-minutes: ${{ github.event_name == 'schedule' && 75 || 25 }}
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '3m' || '30s' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      # The seed corpora (f.Add and testdata/fuzz) also run with the unit
      # tests; this explores beyond them for a little while.
      - name: Fuzz every target
        run: make fuzz FUZZTIME="$FUZZTIME"
      # A failing input is written to testdata/fuzz/FuzzXxx of its package:
      # keep it, to reproduce the failure and add it as a regression seed.
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          retention-days: 30

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      # As root, so that the tests that mount file systems count too.
      - name: Unit tests with coverage
        run: sudo env "PATH=$PATH" go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          echo "Total coverage: $total"
          {
            echo "### Coverage: $total"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            # Statement coverage per package, from the profile.
            awk -F'[: ,]' 'NR > 1 {
                pkg = $1; sub(/\/[^\/]*$/, "", pkg)
                total[pkg] += $(NF-1); if ($NF > 0) covered[pkg] += $(NF-1)
              }
              END { for (p in total) printf "| `%s` | %.1f%% |\n", p, 100 * covered[p] / total[p] }' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 7

  integration:
    name: integration (${{ matrix.runner }}, ${{ matrix.engine }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        engine: [docker]
        include:
          # Podman's Docker-compatible API.
          - runner: ubuntu-latest
            engine: podman
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: make build
      # Ubuntu 24.04 denies capabilities in user namespaces created by
      # unprivileged users: the rootless tests need them.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests against Docker
        if: matrix.engine == 'docker'
        run: sudo ./script/integration-test.sh ./droot
      - name: End-to-end tests against Podman
        if: matrix.engine == 'podman'
        run: |
          podman --version
          sudo systemctl start podman.socket
          sudo DOCKER=podman DOCKER_HOST=unix:///run/podman/podman.sock ./script/integration-test.sh ./droot

  vulnerabilities:
    name: vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The Go version releases are built with: vulnerabilities fixed in the
      # standard library are reported until it includes the fix.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        run: make vuln

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # For actionlint, which make runs with go run.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      # actionlint (syntax, expressions, shellcheck of the run steps) and
      # zizmor (template injection, excessive permissions, unpinned actions,
      # cache poisoning, ...), with the versions of the Makefile. The token
      # (read-only, see the permissions above) lets zizmor run its online
      # audits; --format=github annotates the findings.
      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-actions ZIZMOR_FLAGS=--format=github

  # Builds the release assets exactly like the release workflow, without
  # publishing them, installs the deb and rpm packages, and keeps the assets
  # as a workflow artifact for testing.
  snapshot:
    name: release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          # Like the release job: the assets do not depend on a cache.
          cache: false
      - uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: v1.56.0
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.0
          args: check
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.0
          args: release --snapshot --clean
      - name: Install the deb package
        run: |
          sudo apt-get install -y ./dist/droot_*_amd64.deb
          droot --version
          dpkg -L droot
          bash -c 'source /usr/share/bash-completion/completions/droot && complete -p droot'
          sudo apt-get remove -y droot
          test ! -e /usr/bin/droot
      - name: Install the rpm package
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" almalinux:9 sh -euxc '
            dnf install -y --disablerepo="*" /dist/droot-*.x86_64.rpm
            droot --version
            rpm -ql droot
            dnf remove -y --disablerepo="*" droot
            test ! -e /usr/bin/droot
          '
      - name: Preview the release notes
        run: |
          {
            echo "## Release notes of the next release"
            echo
            script/release-notes.sh Unreleased || echo "_The Unreleased section of CHANGELOG.md is empty._"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          retention-days: 7
