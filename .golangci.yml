version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors: covered by errcheck
        - G115 # integer conversions: uid/gid/device numbers are range-checked or come from the kernel
        - G301 # directory permissions: directories created in container roots must be world-readable (0755)
        - G302 # file permissions: same for files (0644)
        - G304 # file inclusion via variable: reading user-specified paths is droot's job
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, revive]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yuuki/droot
