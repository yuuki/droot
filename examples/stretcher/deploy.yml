# The manifest of stretcher (https://github.com/fujiwara/stretcher) for one
# release of the app run by droot. It is a template: generate the manifest of
# each release from it, e.g. in CI,
#
#   droot export --compress gzip --checksum -o app-1.2.3.tar.gz registry.example.com/app:1.2.3
#   sed -e 's/@VERSION@/1.2.3/g' \
#       -e "s/@SHA256@/$(cut -d' ' -f1 app-1.2.3.tar.gz.sha256)/" \
#       deploy.yml >deploy-1.2.3.yml
#
# and upload the archive and the manifest next to each other.
#
# stretcher, run as root on each server, downloads the archive, verifies its
# checksum, extracts it into a new release directory and switches "current"
# to it. The service runs droot run --config /etc/droot/app.toml
# (examples/droot/app.toml: root = "/var/containers/app/current",
# unshare = true). See documentation/deployment.md#deploying-with-stretcher.
#
# Never set dest to a root directory that droot run uses, with the default
# sync_strategy (rsync -a --delete): rsync deletes what droot creates in the
# root (the device nodes of /dev, the mount points) and, through the bind
# mounts of a run without --unshare, files of the host.

src: s3://example-releases/app/app-@VERSION@.tar.gz
# The SHA-256 of the archive, from app-@VERSION@.tar.gz.sha256.
checksum: "@SHA256@"
# A new directory for every release: stretcher refuses a release that exists.
dest: /var/containers/app/releases/@VERSION@
# Rename the directory stretcher extracted the archive into to dest: the
# files keep the owners, modes, setuid bits and links that tar extracted as
# root, hard links included. stretcher extracts into $TMPDIR, which must be on
# the file system of dest (TMPDIR=/var/containers/app/.tmp).
sync_strategy: mv

commands:
  pre:
    - mkdir -p /var/containers/app/releases
  post:
    # Switch "current" atomically: each droot run uses the release current
    # points to when it starts.
    - ln -sfn releases/@VERSION@ /var/containers/app/current.new && mv -T /var/containers/app/current.new /var/containers/app/current
    - systemctl restart app
    # Keep the 5 most recent releases. droot umount first removes the mounts
    # that a run without --unshare left below a release: rm -rf would delete
    # files of the host through them. Not reached if the restart failed.
    - cd /var/containers/app/releases && ls -1t | tail -n +6 | while read -r r; do /usr/local/bin/droot umount --root "$r" && rm -rf -- "$r"; done
