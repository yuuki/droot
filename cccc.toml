# Configuration of cccc (https://github.com/moznion/cccc), which measures the
# Cognitive and Cyclomatic Complexity of the code. Both the Code Complexity
# workflow (.github/workflows/complexity.yml) and local runs read it:
#
#   cccc --table --top-cognitive 20 cmd internal
#
# cccc exits non-zero, and the workflow fails, when a function, method or
# closure has a Cognitive Complexity over max-cognitive: split it rather than
# raise the limit.

# The Go code without its tests.
languages = ["go"]
exclude = ["*_test.go"]

max-cognitive = 30
