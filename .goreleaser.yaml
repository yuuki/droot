# Release configuration. See documentation/development.md#releasing.
version: 2

project_name: droot

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/droot
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# The assets are named and laid out like those of droot 0.7.7, so that
# download scripts using releases/latest/download/... and the Homebrew
# formula keep working: droot_linux_amd64.tar.gz and droot_darwin_amd64.zip
# containing droot_<os>_<arch>/droot, and bare droot_<os>_<arch> binaries.
archives:
  - id: archive
    formats: [tar.gz]
    format_overrides:
      - goos: darwin
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - LICENSE_OF_DEPENDENCIES.md
      - README.md
      - CHANGELOG.md
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: true
