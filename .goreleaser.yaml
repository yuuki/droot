# Release configuration. See documentation/development.md#releasing.
version: 2

project_name: droot

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/droot
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64, arm]
    # 32-bit ARM (e.g. a Raspberry Pi running a 32-bit OS) is only built
    # for Linux, as ARMv7 with hardware floating point.
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# The assets are named and laid out like those of droot 0.7.7, so that
# download scripts using releases/latest/download/... and the Homebrew
# formula keep working: droot_linux_amd64.tar.gz and droot_darwin_amd64.zip
# containing droot_<os>_<arch>/droot, and bare droot_<os>_<arch> binaries.
# 32-bit ARM assets are named droot_linux_armv7.
archives:
  - id: archive
    formats: [tar.gz]
    format_overrides:
      - goos: darwin
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - LICENSE_OF_DEPENDENCIES.md
      - README.md
      - CHANGELOG.md
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

checksum:
  name_template: checksums.txt

# Keyless signature of checksums.txt with the GitHub OIDC identity of the
# release workflow, written as checksums.txt.sigstore.json. Verifying it and
# then the checksums verifies every asset (see README.md).
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# An SPDX SBOM per archive (droot_linux_amd64.tar.gz.sbom.json, ...),
# written by syft.
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: true
