# Release configuration. See docs/development.md#releasing.
version: 2

project_name: droot

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/droot
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: archive
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - LICENSE_OF_DEPENDENCIES.md
      - README.md
      - CHANGELOG.md
  # Bare binaries named like the assets of droot <= 0.7.7
  # (e.g. droot_linux_amd64), so that existing download scripts keep working.
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: true
