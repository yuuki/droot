# Release configuration. See documentation/development.md#releasing.
#
# The release workflow (.github/workflows/release.yml) runs CI first, so this
# file has no test or `go mod tidy` hooks: a release builds exactly the
# tagged tree. It passes the CHANGELOG.md section of the version as release
# notes (--release-notes) and attests every asset listed in checksums.txt.
version: 2

project_name: droot

# The only hook generates the man page and the shell completion scripts of
# the deb and rpm packages into build/package, which git ignores.
before:
  hooks:
    - ./script/package-files.sh build/package

builds:
  - main: ./cmd/droot
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64, arm]
    # 32-bit ARM (e.g. a Raspberry Pi running a 32-bit OS) is only built
    # for Linux, as ARMv7 with hardware floating point.
    goarm: ["7"]
    ignore:
      - goos: darwin
        goarch: arm
    # Reproducible: no local paths, and file times taken from the commit.
    # Rebuilding the tag with the Go version reported by `go version -m
    # droot` gives identical binaries.
    flags: [-trimpath]
    ldflags:
      # The commit date rather than the build date: reproducible builds.
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# The assets are named and laid out like those of droot 0.7.7, so that
# download scripts using releases/latest/download/... and the Homebrew
# formula keep working: droot_linux_amd64.tar.gz and droot_darwin_amd64.zip
# containing droot_<os>_<arch>/droot, and bare droot_<os>_<arch> binaries.
# 32-bit ARM assets are named droot_linux_armv7.
archives:
  - id: archive
    formats: [tar.gz]
    format_overrides:
      - goos: darwin
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    # Fixed owners, modes and times, so that the archives are reproducible
    # too, whoever builds them.
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &doc
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: LICENSE_OF_DEPENDENCIES.md
        info: *doc
      - src: README.md
        info: *doc
      - src: CHANGELOG.md
        info: *doc
      # The man page, at the top of the archive: man -l droot.1
      - src: documentation/droot.1
        strip_parent: true
        info: *doc
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

# deb and rpm packages for Linux, named like those of other projects:
# droot_0.8.0-1_amd64.deb, droot-0.8.0-1.x86_64.rpm (arm64/aarch64, and
# armhf/armv7hl for 32-bit ARM). The binary is static, so the packages have
# no dependencies and suit every distribution: the rpm has no .el8-like
# distribution tag. They install the binary, the man page, the bash, zsh and
# fish completions and the documentation, all with the time of the commit.
nfpms:
  - id: packages
    package_name: droot
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    vendor: yuuki
    homepage: https://github.com/yuuki/droot
    maintainer: Yuuki Tsubouchi <yuki.tsubo@gmail.com>
    description: |-
      Simple chroot-based application container engine
      Droot runs the file system of a container image, exported as a plain tar
      archive by droot export, with chroot(2) instead of the Docker runtime,
      with dropped capabilities and bind mounts. It does not isolate
      processes, networks, users or resources like Docker.
    license: MIT
    section: admin
    priority: optional
    release: "1"
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      - src: build/package/droot.1.gz
        dst: /usr/share/man/man1/droot.1.gz
        file_info: &pkgfile
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: build/package/completions/droot.bash
        dst: /usr/share/bash-completion/completions/droot
        file_info: *pkgfile
      - src: build/package/completions/_droot
        dst: /usr/share/zsh/vendor-completions/_droot
        packager: deb
        file_info: *pkgfile
      - src: build/package/completions/_droot
        dst: /usr/share/zsh/site-functions/_droot
        packager: rpm
        file_info: *pkgfile
      - src: build/package/completions/droot.fish
        dst: /usr/share/fish/vendor_completions.d/droot.fish
        file_info: *pkgfile
      - src: LICENSE
        dst: /usr/share/doc/droot/copyright
        packager: deb
        file_info: *pkgfile
      - src: LICENSE
        dst: /usr/share/licenses/droot/LICENSE
        packager: rpm
        type: license
        file_info: *pkgfile
      - src: LICENSE_OF_DEPENDENCIES.md
        dst: /usr/share/doc/droot/LICENSE_OF_DEPENDENCIES.md
        file_info: *pkgfile
      - src: README.md
        dst: /usr/share/doc/droot/README.md
        file_info: *pkgfile
      - src: CHANGELOG.md
        dst: /usr/share/doc/droot/CHANGELOG.md
        file_info: *pkgfile
    rpm:
      summary: Simple chroot-based application container engine
      # Rather than the name of the machine that builds it: reproducible.
      buildhost: localhost

# An SPDX SBOM per archive (droot_linux_amd64.tar.gz.sbom.json, ...), made
# by syft, which must be in PATH.
sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Only used when --release-notes is not given (local runs).
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  # Published by a maintainer after review. With immutable releases enabled
  # in the repository settings, the assets and the tag can no longer change
  # once published.
  draft: true
  # Rerunning the workflow replaces the draft instead of adding another one.
  replace_existing_draft: true
  # v1.2.3-rc.1 and the like are marked as pre-releases.
  prerelease: auto
  # Stop before building if the token cannot create the release, or if the
  # tag already has a published (immutable) release.
  preflight:
    fail_on_error: true
  # One line per paragraph: GitHub renders line breaks in release notes.
  # The package version is the tag without its "v", with "~" before the
  # pre-release part (0.8.0~rc.1) so that it sorts before the release.
  footer: |
    ## Installing the deb and rpm packages

    The packages contain the static binary, the man page and the shell completions, and have no dependencies. On Debian, Ubuntu and their derivatives (amd64, arm64, armhf):

    ```console
    $ curl -fsSLO https://github.com/yuuki/droot/releases/download/{{ .Tag }}/droot_{{ replace .Version "-" "~" }}-1_$(dpkg --print-architecture).deb
    $ sudo apt install ./droot_{{ replace .Version "-" "~" }}-1_$(dpkg --print-architecture).deb
    ```

    On RHEL, Fedora, Amazon Linux and other RPM-based distributions (x86_64, aarch64; `droot-{{ replace .Version "-" "~" }}-1.armv7hl.rpm` on 32-bit ARM):

    ```console
    $ sudo dnf install https://github.com/yuuki/droot/releases/download/{{ .Tag }}/droot-{{ replace .Version "-" "~" }}-1.$(uname -m).rpm
    ```

    ## Verifying the downloads

    Every asset and `checksums.txt` have a signed [SLSA build provenance attestation](https://github.com/yuuki/droot/attestations) stating that they were built from `{{ .Tag }}` by the release workflow. Verify one with the [GitHub CLI](https://cli.github.com):

    ```console
    $ gh attestation verify droot_linux_amd64 --repo yuuki/droot \
        --signer-workflow yuuki/droot/.github/workflows/release.yml --source-ref refs/tags/{{ .Tag }}
    ```

    or verify `checksums.txt` the same way, then the downloads with `sha256sum --ignore-missing -c checksums.txt`. The `*.sbom.json` files are SPDX software bills of materials of the archives.
